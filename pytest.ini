[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short tracebacks, print captured output on failure
addopts =
    --tb=short
    -v
    --no-header
    --strict-markers

# Coverage (run with: pytest --cov=src --cov=app --cov-report=term-missing)
# Uncomment to enable by default:
# addopts = --cov=src --cov=app --cov-report=term-missing

markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks tests that require a running Flask server
